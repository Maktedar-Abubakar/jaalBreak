<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JaalBreak check</title>
<style>
  :root { --navy:#14263d; --teal:#247f78; --red:#c62828; --amber:#8f6d00; --yellow:#f2c200; --green:#2e7d32; --slate:#657180; --border:#dce2e8; }
  body { font-family: system-ui, 'Segoe UI', sans-serif; margin: 0; padding: 16px; width: 380px; color: #202a35; background: #f8f9fa; }
  body.tab { width: auto; max-width: 720px; margin: 24px auto; }
  h1 { font-size: 16px; color: var(--navy); margin: 0 0 10px; display: flex; gap: 8px; align-items: center; }
  textarea { width: 100%; box-sizing: border-box; min-height: 110px; font: inherit; font-size: 13px; padding: 8px; border: 1px solid #c5ced8; }
  button { margin-top: 8px; background: var(--navy); color: #fff; border: 0; padding: 9px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  .verdict { margin-top: 12px; border-left: 5px solid var(--slate); background: #fff; padding: 10px 12px; }
  .verdict.high { border-color: var(--red); } .verdict.medium { border-color: var(--yellow); } .verdict.low { border-color: var(--green); }
  .verdict.high strong { color: var(--red); } .verdict.medium strong { color: var(--amber); } .verdict.low strong { color: var(--green); }
  .verdict strong { font-size: 15px; display: block; }
  ul { padding-left: 18px; font-size: 13px; } li { margin: 3px 0; }
  q { background: #f8e9e9; } .muted { color: var(--slate); font-size: 12px; }
  a { color: var(--teal); }
</style>
</head>
<body>
  <h1><img src="icon-128.png" width="22" height="22" alt=""> JaalBreak</h1>
  <textarea id="text" placeholder="Paste or select a suspicious message, link or UPI ID"></textarea>
  <button id="go">Check</button>
  <div id="out"></div>
  <p class="muted">Rule-based warning signs, not proof. Runs on your computer. Never share an OTP, PIN or password. Lost money? Call 1930.</p>
  <script type="module" src="check.js"></script>
</body>
</html>
